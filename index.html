<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eroblack Roulette Pro 32 - Gwo Zoom</title>
    <style>
        body {
            background: radial-gradient(circle, #021128, #000511);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow-x: hidden;
        }

        h2 {
            color: #00ff00;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
            margin: 8px 0 2px 0;
            font-size: 28px;
            text-transform: uppercase;
        }

        p {
            margin: 2px 0 5px 0;
            color: #ccc;
            font-size: 14px;
        }

        /* --- MAXI ZOOM KONTENÈ PRENSIPAL LA --- */
        .roulette-container {
            position: relative;
            width: 560px; /* Lajè ogmante pou gwo wou a */
            height: 560px; /* Wotè ogmante */
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Sa anpeche jwèt la depase sou ti ekran lè l sèvi ak transform scale si sa nesesè */
            transform: scale(0.65); 
            transform-origin: top center;
        }

        /* Flèch Wouj anwo (Wou Deyò) - Vin pi gwo */
        .pointer-outer {
            position: absolute;
            top: -25px;
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ff0055;
            filter: drop-shadow(0 0 8px #ff0055);
        }

        /* Flèch Ble nan mitan (Wou Andedan) - Vin pi gwo */
        .pointer-inner {
            position: absolute;
            top: 130px; 
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 28px solid #00ffff;
            filter: drop-shadow(0 0 8px #00ffff);
        }

        /* Wou Deyò MAXI ZOOM (550px) */
        .wheel-outer {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            border: 10px solid #ffd700;
            background: #111;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.6);
        }

        /* Wou Andedan MAXI ZOOM (290px) */
        .wheel-inner {
            position: absolute;
            width: 290px;
            height: 290px;
            border-radius: 50%;
            border: 6px solid #00ffff;
            background: #222;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        }

        /* Gwo Sant Roulette la */
        .wheel-center {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #ffd700);
            z-index: 5;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .number {
            position: absolute;
            width: 30px;
            height: 30px;
            left: calc(50% - 15px);
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gwo Chif sou Wou Deyò a */
        .wheel-outer .number { 
            top: 15px; 
            font-size: 20px; /* Chif yo vin gwo anpil */
            transform-origin: 15px 260px; 
        }
        
        .num-red { color: #ff3333; text-shadow: 0 0 5px #ff0000; }
        .num-black { color: #ffffff; text-shadow: 0 0 5px #000; }

        /* Gwo Miltiplikatè sou Wou Andedan an */
        .wheel-inner .number { 
            top: 15px; 
            font-size: 16px; 
            transform-origin: 15px 130px; 
            color: #00ffff; 
        }

        .num-zero { color: #ff0055; text-shadow: 0 0 8px #ff0055; font-weight: 900; font-size: 19px !important; }

        /* Zòn Kontwòl ak Bouton - Yo deplase monte paske veso a gen scale */
        .controls-wrapper {
            margin-top: -160px; /* Konpanse spasyal transform scale la */
            position: relative;
            z-index: 20;
        }

        input[type="number"] {
            background: #000;
            border: 3px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            width: 85px;
            font-size: 24px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            color: black;
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            text-transform: uppercase;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        button:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 15px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            min-width: 340px;
            border: 2px solid rgba(0, 255, 0, 0.4);
        }

        .highlight { font-weight: bold; color: #00ff00; font-size: 28px; }
        .highlight-mult { font-weight: bold; color: #00ffff; font-size: 28px; }
    </style>
</head>
<body>

    <h2>Eroblack Roulette Pro</h2>
    <p>Deyò: Nimewo (1-32) | Andedan: Miltiplikatè (X0-X31)</p>

    <!-- Kontenè gwo Roulette la -->
    <div class="roulette-container">
        <div class="pointer-outer"></div>
        <div class="pointer-inner"></div>
        
        <div class="wheel-outer" id="outerWheel">
            <div class="wheel-text" id="outerTexts"></div>
        </div>
        
        <div class="wheel-inner" id="innerWheel">
            <div class="wheel-text" id="innerTexts"></div>
        </div>

        <div class="wheel-center"></div>
    </div>

    <!-- Kontwòl yo ranje anba nèt pou WebView a klè -->
    <div class="controls-wrapper">
        <div class="controls">
            <label for="chwa" style="font-size: 19px; display: block; margin-bottom: 8px;">Chwazi yon chif (1-32):</label>
            <input type="number" id="chwa" min="1" max="32" value="7">
            <br>
            <button id="spinBtn" onclick="vireRoulettePro()">Vire Roulette</button>
        </div>

        <div class="result-box">
            <div id="status">Chwazi nimewo w epi klike bouton an! 🎲</div>
        </div>
    </div>

    <script>
        const totalNimewo = 32;
        const degrePaSeksyon = 360 / totalNimewo; 

        const nimewoDeyo = [];
        for (let i = 1; i <= totalNimewo; i++) { nimewoDeyo.push(i); }

        const nimewoAndedan = [];
        for (let i = 0; i < totalNimewo; i++) { nimewoAndedan.push(i); }

        const outerTexts = document.getElementById('outerTexts');
        const innerTexts = document.getElementById('innerTexts');

        for(let i = 0; i < totalNimewo; i++) {
            let angle = i * degrePaSeksyon;
            
            // Wou Deyò
            let divOuter = document.createElement('div');
            divOuter.className = `number ${i % 2 === 0 ? 'num-red' : 'num-black'}`;
            divOuter.innerText = nimewoDeyo[i];
            divOuter.style.transform = `rotate(${angle}deg)`;
            outerTexts.appendChild(divOuter);

            // Wou Andedan
            let divInner = document.createElement('div');
            divInner.className = 'number';
            if (nimewoAndedan[i] === 0) {
                divInner.classList.add('num-zero');
            }
            divInner.innerText = "X" + nimewoAndedan[i];
            divInner.style.transform = `rotate(${angle}deg)`;
            innerTexts.appendChild(divInner);
        }

        let kouranDegreOuter = 0;
        let kouranDegreInner = 0;

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        function vireRoulettePro() {
            const chwaItilizate = parseInt(document.getElementById('chwa').value);
            
            if(chwaItilizate < 1 || chwaItilizate > 32 || isNaN(chwaItilizate)) {
                alert("Tanpri chwazi yon chif ant 1 ak 32!");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            document.getElementById('status').innerHTML = "Wou yo ap vire ak gwo vitès... 🎰";

            const endèksDeyoGayan = Math.floor(Math.random() * totalNimewo);
            const endèksAndedanGayan = Math.floor(Math.random() * totalNimewo);

            const chifGayan = nimewoDeyo[endèksDeyoGayan];
            const miltiplikatèGayan = nimewoAndedan[endèksAndedanGayan];

            const fwaVire = 5 * 360; 
            
            kouranDegreOuter += fwaVire + (360 - (endèksDeyoGayan * degrePaSeksyon));
            kouranDegreInner -= (fwaVire + (endèksAndedanGayan * degrePaSeksyon));

            document.getElementById('outerWheel').style.transform = `rotate(${kouranDegreOuter}deg)`;
            document.getElementById('innerWheel').style.transform = `rotate(${kouranDegreInner}deg)`;

            setTimeout(() => {
                btn.disabled = false;
                
                let teGenyen = (chwaItilizate === chifGayan);
                let mesaj = "";

                if (teGenyen) {
                    if (miltiplikatèGayan === 0) {
                        mesaj = `🎯 Ou jwenn nimewo <span class="highlight">${chifGayan}</span> lan! <br>Men, miltiplikatè a bay <span class="num-zero">X0</span>... Ou touche 0 fwa mize w lan! 😮`;
                        sendToApp("roulette_genyen", "0");
                    } else {
                        mesaj = `🎉 **BRAVO!** Wou a bay nimewo <span class="highlight">${chifGayan}</span>!<br>Miltiplikatè ou se: <span class="highlight-mult">X${miltiplikatèGayan}</span>!`;
                        sendToApp("roulette_genyen", miltiplikatèGayan);
                    }
                } else {
                    mesaj = `😞 **Ou pèdi!** Wou a bay nimewo <span class="highlight" style="color:#ff3333">${chifGayan}</span>.<br>Miltiplikatè a te soti: X${miltiplikatèGayan}.`;
                    sendToApp("roulette_pedi", "0");
                }

                document.getElementById('status').innerHTML = mesaj;
            }, 5000);
        }
    </script>
</body>
</html>
