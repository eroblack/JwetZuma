<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zuma Eroblack Fix</title>
    <style>
        body { background: #051505; margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-around;
            color: #ffd700; font-size: 18px; pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>ZUMA EROBLACK</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    const ballRadius = 18; // Gwosè boul yo
    const ballSpacing = 40; // Espas ant boul yo pou yo pa kole
    
    // Jenere koulè o aza pou pati a
    function getRandomColors() {
        return [
            `hsl(${Math.random()*360}, 100%, 50%)`,
            `hsl(${Math.random()*360}, 100%, 50%)`,
            `hsl(${Math.random()*360}, 100%, 50%)`,
            `hsl(${Math.random()*360}, 100%, 50%)`
        ];
    }
    let gameColors = getRandomColors();

    // 1. CHEMEN AN (TRACK)
    const path = [];
    for (let i = 0; i < 1200; i++) {
        let t = i / 1200;
        // Yon fòm "S" ki pi bèl
        let x = canvas.width * 0.5 + Math.sin(t * 8) * (canvas.width * 0.35);
        let y = canvas.height * 0.1 + t * (canvas.height * 0.7);
        path.push({x, y});
    }

    let ballsInPath = [];
    let spawnCounter = 0;

    // 2. SHOOTER
    const shooter = { 
        x: canvas.width / 2, 
        y: canvas.height - 60, 
        color: gameColors[Math.floor(Math.random() * gameColors.length)] 
    };
    let bullets = [];

    function drawBall(x, y, color) {
        ctx.beginPath();
        let grad = ctx.createRadialGradient(x-5, y-5, 2, x, y, ballRadius);
        grad.addColorStop(0, "white");
        grad.addColorStop(1, color);
        ctx.fillStyle = grad;
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.stroke();
        ctx.closePath();
    }

    function update() {
        ctx.fillStyle = "#051505"; // Netwaye ekran an
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Trase liy chemen an (Background)
        ctx.beginPath();
        ctx.strokeStyle = "#112211";
        ctx.lineWidth = 40;
        ctx.lineJoin = "round";
        ctx.moveTo(path[0].x, path[0].y);
        path.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();

        // Deplase boul sou chemen an
        for (let i = 0; i < ballsInPath.length; i++) {
            let b = ballsInPath[i];
            b.index += 1.2; // Vitès woule a

            if (b.index < path.length) {
                let p = path[Math.floor(b.index)];
                drawBall(p.x, p.y, b.color);
            }
        }

        // Trase Shooter la
        drawBall(shooter.x, shooter.y, shooter.color);

        // Jere Bullets (Boul ou tire yo)
        for (let i = bullets.length - 1; i >= 0; i--) {
            let bullet = bullets[i];
            bullet.x += bullet.vx;
            bullet.y += bullet.vy;
            drawBall(bullet.x, bullet.y, bullet.color);

            // Kolizyon
            for (let j = ballsInPath.length - 1; j >= 0; j--) {
                let target = ballsInPath[j];
                if (target.index >= path.length) continue;
                
                let p = path[Math.floor(target.index)];
                let dist = Math.hypot(bullet.x - p.x, bullet.y - p.y);

                if (dist < ballRadius * 2) {
                    if (bullet.color === target.color) {
                        ballsInPath.splice(j, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                    bullets.splice(i, 1);
                    break;
                }
            }
        }

        // Spawn nouvo boul
        if (spawnCounter++ % ballSpacing === 0) {
            ballsInPath.push({
                index: 0,
                color: gameColors[Math.floor(Math.random() * gameColors.length)]
            });
        }

        requestAnimationFrame(update);
    }

    window.addEventListener('click', (e) => {
        let angle = Math.atan2(e.clientY - shooter.y, e.clientX - shooter.x);
        bullets.push({
            x: shooter.x,
            y: shooter.y,
            vx: Math.cos(angle) * 12,
            vy: Math.sin(angle) * 12,
            color: shooter.color
        });
        shooter.color = gameColors[Math.floor(Math.random() * gameColors.length)];
    });

    update();
</script>
</body>
</html>
