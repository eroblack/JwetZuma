<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Memory Game</title>
    <style>
        body {
            background: #050a14; color: white; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
        }
        h2 { color: #ffd700; margin-bottom: 20px; }
        
        .grid {
            display: grid; grid-template-columns: repeat(3, 100px);
            gap: 15px; perspective: 1000px;
        }

        .card {
            width: 100px; height: 130px;
            position: relative; transform-style: preserve-3d;
            transition: transform 0.6s; cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex;
            align-items: center; justify-content: center;
            font-size: 40px; border-radius: 10px; border: 2px solid #333;
        }

        .front { background: #1a1a1a; color: #ffd700; font-weight: bold; }
        .back { background: #ffd700; transform: rotateY(180deg); color: #000; }

        #msg { margin-top: 20px; font-weight: bold; color: #00ff00; height: 20px; }
    </style>
</head>
<body>

    <h2>MEMWA EROBLACK</h2>
    
    <div class="grid" id="game-grid"></div>
    <div id="msg"></div>

    <script>
        // Nou itilize emojis kòm senbòl sou kat yo
        const symbols = ['🔥', '💰', '💎', '🔥', '💰', '💎'];
        let flippedCards = [];
        let matchedPairs = 0;
        let canClick = true;

        // Melanje kat yo o aza
        const shuffledSymbols = symbols.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('game-grid');

        function createBoard() {
            shuffledSymbols.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.symbol = symbol;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face front">?</div>
                    <div class="card-face back">${symbol}</div>
                `;

                card.addEventListener('click', () => flipCard(card));
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canClick || card.classList.contains('flipped') || flippedCards.length >= 2) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            canClick = false;
            const [card1, card2] = flippedCards;

            if (card1.dataset.symbol === card2.dataset.symbol) {
                matchedPairs++;
                flippedCards = [];
                canClick = true;
                if (matchedPairs === 3) {
                    document.getElementById('msg').innerText = "BRAVO! OU GENYEN!";
                    // Si se pou parayj, ou ka voye kòb la isit la
                    if (window.Android) window.Android.voyeKòb("genyen", "50");
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canClick = true;
                }, 1000);
            }
        }

        createBoard();
    </script>
</body>
</html>
