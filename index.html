<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eroblack Double Roulette</title>
    <style>
        body {
            background: radial-gradient(circle, #021128, #000511);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 5px;
        }

        /* Kontenè prensipal pou Roulette yo */
        .roulette-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Flèch ki endike kote wou a rete a (nan mitan anwo) */
        .pointer {
            position: absolute;
            top: -20px;
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff0055;
            filter: drop-shadow(0 0 5px #ff0055);
        }

        /* Wou Deyò (Chif Chans) - Ap vire a dwat */
        .wheel-outer {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 5px solid #00ff00;
            background: conic-gradient(
                #111 0deg 60deg, #222 60deg 120deg, 
                #111 120deg 180deg, #222 180deg 240deg, 
                #111 240deg 300deg, #222 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        /* Wou Ndandan (Miltiplikatè) - Ap vire a gòch */
        .wheel-inner {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #00ffff;
            background: conic-gradient(
                #333 0deg 60deg, #444 60deg 120deg, 
                #333 120deg 180deg, #444 180deg 240deg, 
                #333 240deg 300deg, #444 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 2;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* Teks andedan wou yo */
        .wheel-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .number {
            position: absolute;
            width: 30px;
            height: 30px;
            left: calc(50% - 15px);
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pozisyon tèks pou Wou Deyò */
        .wheel-outer .number { top: 15px; transform-origin: 15px 135px; }
        /* Pozisyon tèks pou Wou Andedan */
        .wheel-inner .number { top: 10px; transform-origin: 15px 80px; color: #00ffff; }

        /* Bouton ak Rezilta */
        .controls {
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            color: black;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            text-transform: uppercase;
        }

        button:disabled {
            background: #555;
            color: #aaa;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 25px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 280px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .highlight { font-weight: bold; color: #00ff00; }
        .highlight-mult { font-weight: bold; color: #00ffff; }
    </style>
</head>
<body>

    <h2>EROBLACK DOUBLE ROULETTE</h2>
    <p>Wou deyò: Nimewo chans | Wou andedan: Kantite fwa (X)</p>

    <div class="roulette-container">
        <div class="pointer"></div>
        <!-- Wou Deyò (Chif) -->
        <div class="wheel-outer" id="outerWheel">
            <div class="wheel-text" id="outerTexts"></div>
        </div>
        <!-- Wou Andedan (Miltiplikatè) -->
        <div class="wheel-inner" id="innerWheel">
            <div class="wheel-text" id="innerTexts"></div>
        </div>
    </div>

    <div class="controls">
        <label for="chwa">Chwazi yon nimewo (1-6): </label>
        <input type="number" id="chwa" min="1" max="6" value="1" style="padding: 5px; width: 50px; font-size: 16px; text-align: center;"><br><br>
        <button id="spinBtn" onclick="vireRoulette()">VIRE ROULETTE LA</button>
    </div>

    <div class="result-box">
        <div id="status">Tann ou jwe...</div>
    </div>

    <script>
        // Pou egzanp sa a, nou itilize 6 chif sou chak wou (1 a 6)
        const chifYo = [1, 2, 3, 4, 5, 6];
        const degrePaSeksyon = 360 / chifYo.length; // 60 degre pou chak seksyon

        // Mete chif yo vizyèlman sou de wou yo lè paj la chaje
        const outerTexts = document.getElementById('outerTexts');
        const innerTexts = document.getElementById('innerTexts');

        chifYo.forEach((chif, index) => {
            let angle = index * degrePaSeksyon;
            
            // Wou Deyò
            let divOuter = document.createElement('div');
            divOuter.className = 'number';
            divOuter.innerText = chif;
            divOuter.style.transform = `rotate(${angle}deg)`;
            outerTexts.appendChild(divOuter);

            // Wou Andedan (Miltiplikatè egz: X1, X2...)
            let divInner = document.createElement('div');
            divInner.className = 'number';
            divInner.innerText = "X" + chif;
            divInner.style.transform = `rotate(${angle}deg)`;
            innerTexts.appendChild(divInner);
        });

        let kouranDegreOuter = 0;
        let kouranDegreInner = 0;

        function sendToApp(bwat, val) {
            if (window.Android) { window.Android.voyeKòb(bwat, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(bwat + ":" + val); }
        }

        function vireRoulette() {
            const chwaItilizate = parseInt(document.getElementById('chwa').value);
            if(chwaItilizate < 1 || chwaItilizate > 6 || isNaN(chwaItilizate)) {
                alert("Tanpri chwazi yon chif ant 1 ak 6");
                return;
            }

            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            document.getElementById('status').innerHTML = "Wou yo ap vire... 🎲";

            // Jenerasyon oaza kote wou yo ap rete
            const endèksChifGayan = Math.floor(Math.random() * chifYo.length);
            const endèksMultGayan = Math.floor(Math.random() * chifYo.length);

            const chifGayan = chifYo[endèksChifGayan];
            const miltiplikatèGayan = chifYo[endèksMultGayan];

            // Kalkile degre pou mete chif gayan an egzakteman anba flèch la (0 degre / tèt la)
            // Nou ajoute plizyè tou (vire) pou rann li bèl: Deyò vire a dwat (+), Andedan vire a gòch (-)
            const fwaVire = 5 * 360; 
            
            kouranDegreOuter += fwaVire + (360 - (endèksChifGayan * degrePaSeksyon));
            kouranDegreInner -= (fwaVire + (endèksMultGayan * degrePaSeksyon));

            // Aplike animasyon an nan CSS
            document.getElementById('outerWheel').style.transform = `rotate(${kouranDegreOuter}deg)`;
            document.getElementById('innerWheel').style.transform = `rotate(${kouranDegreInner}deg)`;

            // Tann 4 segonn (tan animasyon an fini) pou bay rezilta
            setTimeout(() => {
                btn.disabled = false;
                
                let teGenyen = (chwaItilizate === chifGayan);
                let mesaj = "";

                if (teGenyen) {
                    mesaj = `🎉 OUKAN! Wou a bay <span class="highlight">${chifGayan}</span>!<br>Miltiplikatè a bay: <span class="highlight-mult">X${miltiplikatèGayan}</span>!<br>Ou genyen jwèt la <span class="highlight">${miltiplikatèGayan} fwa</span>!`;
                    // Voye siyal bay Sketchware pou di li genyen epi ba li valè miltiplikatè a
                    sendToApp("roulette_genyen", miltiplikatèGayan);
                } else {
                    mesaj = `😞 Ou pèdi! Wou a bay <span class="highlight">${chifGayan}</span> (Ou te chwazi ${chwaItilizate}).<br>Miltiplikatè a te soti: X${miltiplikatèGayan}.`;
                    sendToApp("roulette_pedi", "0");
                }

                document.getElementById('status').innerHTML = mesaj;
            }, 4000);
        }
    </script>
</body>
</html>
