<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zuma Eroblack Pro</title>
    <style>
        body { background: #051505; margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-around;
            color: #ffd700; font-size: 18px; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div id="status">ZUMA EROBLACK</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let gameActive = true;
    const ballRadius = 18;
    const speed = 0.8; // Vitès la redui pou l pa twò vit
    
    function getRandomColors() {
        return ['#ff0000', '#00ff00', '#0066ff', '#ffff00', '#ff00ff'];
    }
    let gameColors = getRandomColors();

    // 1. CHEMEN AN (TRACK)
    const path = [];
    for (let i = 0; i < 1500; i++) {
        let t = i / 1500;
        let x = canvas.width * 0.5 + Math.sin(t * 7) * (canvas.width * 0.4);
        let y = canvas.height * 0.05 + t * (canvas.height * 0.85);
        path.push({x, y});
    }

    let ballsInPath = [];
    let spawnCounter = 0;

    // 2. SHOOTER
    const shooter = { 
        x: canvas.width / 2, 
        y: canvas.height - 60, 
        color: gameColors[Math.floor(Math.random() * gameColors.length)] 
    };
    let bullets = [];

    function drawBall(x, y, color) {
        ctx.beginPath();
        let grad = ctx.createRadialGradient(x-5, y-5, 2, x, y, ballRadius);
        grad.addColorStop(0, "white");
        grad.addColorStop(1, color);
        ctx.fillStyle = grad;
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.stroke();
    }

    function update() {
        if (!gameActive) return;

        ctx.fillStyle = "#051505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Trase Twou a nan bout la
        let lastP = path[path.length - 1];
        ctx.beginPath();
        ctx.fillStyle = "#000";
        ctx.arc(lastP.x, lastP.y, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ff0000";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Deplase boul yo
        for (let i = 0; i < ballsInPath.length; i++) {
            ballsInPath[i].index += speed;

            // SI BOUL LA RIVE NAN TWOU A
            if (ballsInPath[i].index >= path.length - 10) {
                gameOver();
                return;
            }

            let p = path[Math.floor(ballsInPath[i].index)];
            drawBall(p.x, p.y, ballsInPath[i].color);
        }

        // Trase Shooter
        drawBall(shooter.x, shooter.y, shooter.color);

        // Jere Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            drawBall(b.x, b.y, b.color);

            // Deteksyon Kolizyon
            for (let j = 0; j < ballsInPath.length; j++) {
                let target = ballsInPath[j];
                let p = path[Math.floor(target.index)];
                let dist = Math.hypot(b.x - p.x, b.y - p.y);

                if (dist < ballRadius * 2) {
                    handleHit(j, b.color);
                    bullets.splice(i, 1);
                    break;
                }
            }
        }

        if (spawnCounter++ % 45 === 0) {
            ballsInPath.push({ index: 0, color: gameColors[Math.floor(Math.random() * gameColors.length)] });
        }

        requestAnimationFrame(update);
    }

    // LOJIK POU KRAZE PLIZYÈ BOUL ANMENMTAN
    function handleHit(hitIndex, bulletColor) {
        let targetColor = ballsInPath[hitIndex].color;

        if (bulletColor === targetColor) {
            let toRemove = [hitIndex];

            // Tcheke boul ki anvan l yo
            for (let i = hitIndex - 1; i >= 0; i--) {
                if (ballsInPath[i].color === targetColor) toRemove.push(i);
                else break;
            }
            // Tcheke boul ki apre l yo
            for (let i = hitIndex + 1; i < ballsInPath.length; i++) {
                if (ballsInPath[i].color === targetColor) toRemove.push(i);
                else break;
            }

            // Si gen 2 oswa plis (ansanm ak sa w tire a sa fè 3)
            if (toRemove.length >= 1) {
                toRemove.sort((a, b) => b - a); // Retire soti nan pi gwo index pou pa gen erè
                toRemove.forEach(idx => ballsInPath.splice(idx, 1));
                score += toRemove.length * 10;
                scoreEl.innerText = score;
            }
        } else {
            // Si koulè a pa menm, nou jis ajoute boul la nan liy lan (Opsyonèl)
            ballsInPath.splice(hitIndex, 0, { index: ballsInPath[hitIndex].index - 20, color: bulletColor });
        }
    }

    function gameOver() {
        gameActive = false;
        alert("GAME OVER! Boul yo rive nan twou a.");
        location.reload();
    }

    window.addEventListener('click', (e) => {
        if (!gameActive) return;
        let angle = Math.atan2(e.clientY - shooter.y, e.clientX - shooter.x);
        bullets.push({
            x: shooter.x, y: shooter.y,
            vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
            color: shooter.color
        });
        shooter.color = gameColors[Math.floor(Math.random() * gameColors.length)];
    });

    update();
</script>
</body>
</html>
