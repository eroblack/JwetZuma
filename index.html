<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eroblack Card Game</title>
    <style>
        body {
            background: radial-gradient(circle, #021128, #000511);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            overflow: hidden;
        }

        h2 {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin: 5px 0;
            font-size: 26px;
            text-transform: uppercase;
        }

        p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* --- CARD 3D ANIMATION ZONE --- */
        .card-container {
            width: 150px;
            height: 220px;
            margin: 20px auto;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
        }

        /* Card Back */
        .card-back {
            background: linear-gradient(135deg, #a30000, #4a0000);
            border: 3px solid #ffd700;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Card Front */
        .card-front {
            background: white;
            color: black;
            transform: rotateY(180deg);
            border: 1px solid #ccc;
        }

        .card-front .suit-corner {
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }
        .card-front .suit-corner.bottom {
            transform: rotate(180deg);
        }

        .card-front .suit-center {
            font-size: 65px;
            text-align: center;
            align-self: center;
        }

        /* Colors */
        .text-red { color: #ff3333; }
        .text-black { color: #111111; }

        /* --- CONTROLS --- */
        .options {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-opt {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-red { background-color: #ff3333; color: white; }
        .btn-black { background-color: #111; color: white; border-color: #333; }

        .btn-red.selected { border-color: #ffd700; box-shadow: 0 0 15px #ff3333; }
        .btn-black.selected { border-color: #ffd700; box-shadow: 0 0 15px #ffffff; }

        .play-btn {
            background: linear-gradient(135deg, #00ff00, #00aa00);
            border: none;
            color: black;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .play-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 10px;
            display: inline-block;
            min-width: 300px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .highlight-win { color: #00ff00; font-weight: bold; font-size: 22px; }
        .highlight-lose { color: #ff3333; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

    <h2>EROBLACK LUCKY CARD</h2>
    <p>Guess if the next card will be RED or BLACK to win!</p>

    <div class="card-container">
        <div class="card" id="myCard">
            <!-- Back Face -->
            <div class="card-face card-back">EB</div>
            <!-- Front Face -->
            <div class="card-face card-front" id="cardFront">
                <div class="suit-corner top" id="cornerTop">A ♥</div>
                <div class="suit-center" id="centerSuit">♥</div>
                <div class="suit-corner bottom" id="cornerBottom">A ♥</div>
            </div>
        </div>
    </div>

    <!-- User Selection -->
    <div class="options">
        <button class="btn-opt btn-red selected" id="optRed" onclick="chooseColor('Red')">Red</button>
        <button class="btn-opt btn-black" id="optBlack" onclick="chooseColor('Black')">Black</button>
    </div>

    <div>
        <button class="play-btn" id="actionBtn" onclick="drawCard()">Draw a card</button>
    </div>

    <div class="result-box">
        <div id="status">Choose a color and click the button! 🃏</div>
    </div>

    <script>
        const cards = [
            { value: 'A', suit: '♥', color: 'Red' },
            { value: 'K', suit: '♦', color: 'Red' },
            { value: 'Q', suit: '♣', color: 'Black' },
            { value: 'J', suit: '♠', color: 'Black' },
            { value: '10', suit: '♥', color: 'Red' },
            { value: '9', suit: '♠', color: 'Black' },
            { value: '8', suit: '♦', color: 'Red' },
            { value: '7', suit: '♣', color: 'Black' }
        ];

        let chosenColor = 'Red';
        let isFlipped = false;

        function sendToApp(tag, val) {
            if (window.Android) { window.Android.voyeKòb(tag, val.toString()); }
            if (window.SketchwareInterface) { window.SketchwareInterface.voyeKòb(tag + ":" + val); }
        }

        function chooseColor(color) {
            if (isFlipped) return; 
            
            chosenColor = color;
            if (color === 'Red') {
                document.getElementById('optRed').classList.add('selected');
                document.getElementById('optBlack').classList.remove('selected');
            } else {
                document.getElementById('optBlack').classList.add('selected');
                document.getElementById('optRed').classList.add('selected');
                document.getElementById('optRed').classList.remove('selected');
            }
        }

        function drawCard() {
            const cardElement = document.getElementById('myCard');
            const actionBtn = document.getElementById('actionBtn');
            
            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                actionBtn.innerText = "Draw a card";
                document.getElementById('status').innerText = "Choose a color again...";
                return;
            }

            actionBtn.disabled = true;
            document.getElementById('status').innerText = "Shuffling cards... 🎲";

            const randomIndex = Math.floor(Math.random() * cards.length);
            const winningCard = cards[randomIndex];

            const cardFront = document.getElementById('cardFront');
            const cornerTop = document.getElementById('cornerTop');
            const centerSuit = document.getElementById('centerSuit');
            const cornerBottom = document.getElementById('cornerBottom');

            if (winningCard.color === 'Red') {
                cardFront.className = "card-face card-front text-red";
            } else {
                cardFront.className = "card-face card-front text-black";
            }

            cornerTop.innerText = `${winningCard.value} ${winningCard.suit}`;
            centerSuit.innerText = winningCard.suit;
            cornerBottom.innerText = `${winningCard.value} ${winningCard.suit}`;

            setTimeout(() => {
                cardElement.classList.add('flipped');
                isFlipped = true;
                actionBtn.disabled = false;
                actionBtn.innerText = "PLAY AGAIN";

                if (chosenColor === winningCard.color) {
                    document.getElementById('status').innerHTML = `<span class="highlight-win">🎉 YOU WIN!</span><br>The card is ${winningCard.value} ${winningCard.suit} (${winningCard.color}).`;
                    sendToApp("kat_genyen", "1");
                } else {
                    document.getElementById('status').innerHTML = `<span class="highlight-lose">😞 YOU LOSE!</span><br>The card is ${winningCard.value} ${winningCard.suit} (${winningCard.color}).`;
                    sendToApp("kat_pedi", "0");
                }
            }, 600);
        }
    </script>
</body>
</html>
